<div class="content">
  <app-header />
  @for (tab of [calculator]; track tab.id) {
    <h1 class="calculator-title">
      @if (tab.wikiPage) {
        <a [href]="tab.wikiPage" target="_blank" rel="noopener">{{ tab.name }}</a>
      } @else {
        {{ tab.name }}
      }
    </h1>
  }
  <div class="calculator" [class.planner-route]="wideTabs.includes(calculator.id)">
    @for (tab of [calculator]; track tab.id) {
      <img class="background-img" [src]="tab.iconPath" alt="">
    }
    <router-outlet />
  </div>
</div>
<a class="repolink" href="https://github.com/erykczy/createmod-calculator" target="_blank" rel="noopener">
  <img src="assets/icons/github.png" alt="Upstream GitHub repository" [tooltip]="'Upstream GitHub repository'">
</a>
