<div class="content">
  <app-header />
  @if (!isWorkshop) {
    <a [href]="calculator.wikiPage" target="_blank" rel="noopener">
      <h1 [class.fadein]="switchTabAnimation" (animationend)="onAnimationend()">{{ calculator.name }}</h1>
    </a>
  }
  <div class="calculator" [class.workshop-route]="isWorkshop" [class.fadein]="!isWorkshop && switchTabAnimation">
    <img class="background-img" [src]="workshopIcon ?? calculator.iconPath" alt="">
    <router-outlet />
  </div>
</div>
<a class="repolink" href="https://github.com/erykczy/createmod-calculator" target="_blank" rel="noopener">
  <img src="assets/icons/github.png" alt="Upstream GitHub repository" [tooltip]="'Upstream GitHub repository'">
</a>
