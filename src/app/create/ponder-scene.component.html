<figure class="ponder">
  @if (clips.length > 1) {
    <div class="ponder-controls" role="group" aria-label="Ponder scenes">
      @for (clip of clips; track clip.id) {
        <button class="tool-button" type="button" [attr.aria-pressed]="active === $index"
          (click)="active = $index">{{ clip.title }}</button>
      }
    </div>
  }
  @for (clip of [clips[active]]; track clip.id) {
    <video controls playsinline preload="none" [poster]="mediaPath + clip.id + '.webp'"
      [src]="mediaPath + clip.id + '.mp4'" [attr.aria-label]="clip.title"></video>
    <figcaption>
      <strong>{{ clip.title }}</strong>
      <p>{{ clip.description }}</p>
    </figcaption>
  }
</figure>
