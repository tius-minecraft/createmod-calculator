<div class="head">
  <label [attr.for]="'number-' + id()" [class.stress]="stress()" [tooltip]="hint()">
    <ng-content />
  </label>
</div>
<input [id]="'number-' + id()" inputmode="decimal" [disabled]="disabled()" [class.stress]="stress()" [clickSelect]="readonly()" [readOnly]="readonly()" (focus)="onFocus()" (blur)="onBlur()" [ngModel]="ngModelValue()" (ngModelChange)="onNgModelChange($event)">
