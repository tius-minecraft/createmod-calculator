<nav class="header" aria-label="Machine calculators">
  @for (calculator of calculatorsData; track calculator.id) {
    <button type="button" class="tab" [routerLink]="['/', calculator.id]" routerLinkActive="selected"
      ariaCurrentWhenActive="page" [tooltip]="calculator.name">
      <img [src]="calculator.iconPath" [alt]="calculator.name">
    </button>
  }
</nav>
<nav class="tool-header" aria-label="Factory tools">
  @for (tool of factoryTabs; track tool.id) {
    <a class="tool-tile" [routerLink]="['/', tool.id]" routerLinkActive="selected" ariaCurrentWhenActive="page">
      <span class="tab" aria-hidden="true"><img [src]="iconPath(tool.icon)" alt=""></span>
      <span class="tile-label">{{ tool.label }}</span>
    </a>
  }
</nav>
